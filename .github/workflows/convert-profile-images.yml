name: Convert Profile Images to AVIF

on:
  push:
    branches:
      - trunk
    paths:
      - "hugo/content/doulas/**/*-profile.jpg"
      - "hugo/content/doulas/**/*-profile.jpeg"
      - "hugo/content/doulas/**/*-profile.png"
      - "hugo/content/doulas/**/*-profile.webp"

permissions:
  contents: write

jobs:
  convert_images:
    # Skip if commit was made by github-actions bot (to prevent infinite loop)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          # Mark the directory as safe for git operations
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: bun install

      - name: Find changed profile images
        id: changed
        run: |
          # Get list of changed profile image files
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- \
            "hugo/content/doulas/**/*-profile.jpg" \
            "hugo/content/doulas/**/*-profile.jpeg" \
            "hugo/content/doulas/**/*-profile.png" \
            "hugo/content/doulas/**/*-profile.webp" 2>/dev/null || echo "")

          if [ -z "$CHANGED" ]; then
            echo "No profile images changed"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Profile images changed:"
            echo "$CHANGED"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Convert images to AVIF
        if: steps.changed.outputs.skip != 'true'
        run: bun run convert-images-to-avif.ts --force

      - name: Check for generated files
        if: steps.changed.outputs.skip != 'true'
        id: check
        run: |
          # Check if any AVIF files were modified
          MODIFIED=$(git status --porcelain -- "hugo/content/doulas/**/*.avif" | wc -l)
          if [ "$MODIFIED" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Found $MODIFIED modified AVIF files"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No AVIF files were modified"
          fi

      - name: Commit converted images
        if: steps.changed.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true'
        run: |
          # Attempt to commit and push, handling potential conflicts
          MAX_RETRIES=3
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Check if there are still changes to commit
            MODIFIED=$(git status --porcelain -- "hugo/content/doulas/**/*.avif" | wc -l)
            if [ "$MODIFIED" -eq 0 ]; then
              echo "No AVIF changes to commit"
              exit 0
            fi

            git add "hugo/content/doulas/**/*.avif"
            git commit -m "Generate AVIF variants for profile images

          [automated]" || {
              echo "Nothing to commit"
              exit 0
            }

            # Try to push, if it fails due to conflict, pull and retry
            if git push origin trunk; then
              echo "Successfully pushed AVIF images"
              exit 0
            fi

            echo "Push failed, attempting to pull and retry..."
            git pull --rebase origin trunk || {
              echo "Rebase failed, resetting and retrying..."
              git rebase --abort || true
              git reset --hard HEAD~1
            }

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Retry $RETRY_COUNT of $MAX_RETRIES"
          done

          echo "Failed to push after $MAX_RETRIES retries"
          exit 1
        continue-on-error: true
