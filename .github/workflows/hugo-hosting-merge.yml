name: Deploy to Hugo site to Firebase Hosting on merge
on:
  push:
    branches:
      - trunk
    paths:
      - "hugo/**"
      - "firebase.json"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install dependencies
        run: bun install
      - name: Build Hugo site
        run: bun run build
        env:
          # Hugo templates use {{ os.Getenv "VAR_NAME" }} to read these
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_PRICING_TABLE_ID: ${{ secrets.STRIPE_TEST_PRICING_TABLE_ID }}
          STRIPE_VISIBILITY_KEY: ${{ secrets.STRIPE_VISIBILITY_KEY }}
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOULA_COOPERATIVE }}
          channelId: live
          projectId: doula-cooperative
          target: main-site
      - name: Notify Profile Updates
        if: success()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_SHA=$(git rev-parse HEAD)

          # Get changed profile files (both index.md and profile images)
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- \
            "hugo/content/doulas/*/index.md" \
            "hugo/content/doulas/**/*-profile.jpg" \
            "hugo/content/doulas/**/*-profile.jpeg" \
            "hugo/content/doulas/**/*-profile.png" \
            "hugo/content/doulas/**/*-profile.webp" \
            "hugo/content/doulas/**/*-profile.avif" \
            2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            FILE_COUNT=0
          else
            FILE_COUNT=$(echo "$CHANGED_FILES" | wc -l)
          fi

          # Extract slug if single file (from either index.md or image path)
          if [ "$FILE_COUNT" -eq 1 ]; then
            # Try extracting from index.md path first
            SLUG=$(echo "$CHANGED_FILES" | sed -n 's|hugo/content/doulas/\([^/]*\)/index.md|\1|p')
            # If empty, try extracting from image path
            if [ -z "$SLUG" ]; then
              SLUG=$(echo "$CHANGED_FILES" | sed -n 's|hugo/content/doulas/\([^/]*\)/.*|\1|p')
            fi
          else
            SLUG=""
          fi

          curl -X POST https://doulacooperative.com/api/profile-deployment-webhook \
            -H "Content-Type: application/json" \
            -d "{\"commitMessage\":\"$COMMIT_MSG\",\"commitSha\":\"$COMMIT_SHA\",\"slug\":\"$SLUG\",\"secret\":\"${{ secrets.DEPLOY_WEBHOOK_SECRET }}\"}"
        continue-on-error: true
