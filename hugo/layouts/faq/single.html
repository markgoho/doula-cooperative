{{ define "head-styles" }}
  {{ $css := resources.Get "css/components/text-link.css" | resources.Minify }}
  <style>{{ $css.Content | safeCSS }}</style>
{{ end }}

{{ define "main" }}
  <a class="back-link" href="{{ "/faq/" | relLangURL }}">
    {{ partial "icons/arrow-right.html" . }}
    {{ i18n "faq_back" }}
  </a>
  <h1
    class="faq-question"
    style="view-transition-name: faq-title-{{ .Title | md5 }};">
    {{ .Title }}
  </h1>
  <section
    style="view-transition-name: faq-content-{{ .Title | md5 }};"
    class="text-content">
    {{ .Content }}
  </section>
  {{ partial "page-cta.html" . }}
{{ end }}
