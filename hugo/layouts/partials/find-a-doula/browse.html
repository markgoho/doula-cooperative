{{ .Content }}
<ul class="tag-group top-tags">
  {{ range first 5 (partial "find-a-doula/canonical-tags.html" .) }}
    <li class="tag">
      <a href="{{ .Page.RelPermalink }}"
        ><span style="view-transition-name: title-{{ .Page.Title | md5 }};"
          >{{ .Page.Title | title }}</span
        >
        ({{ .Count }})</a
      >
    </li>
  {{ end }}
</ul>
