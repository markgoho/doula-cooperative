{{ .Content }}


<div class="form-container">
  <form
    class="form"
    novalidate
    data-api-url="{{ if hugo.IsProduction }}
      /api/forms/doula-match
    {{ else }}
      http://127.0.0.1:5001/doula-cooperative/us-central1/formsApi/doula-match
    {{ end }}"
    data-recaptcha-site-key="{{ .Site.Params.recaptchaSiteKey }}"
    data-success-url="{{ "/thank-you-for-your-match-request/" | relLangURL }}"
    data-text-verifying="{{ i18n "form_verifying_text" }}"
    data-text-sending="{{ i18n "form_sending_text" }}"
    data-text-submit="{{ i18n "form_submit_button" }}"
    data-text-date-range-error="{{ i18n "form_date_range_error" }}"
    data-text-generic-error="{{ i18n "form_generic_error" }}">
    <input type="hidden" name="locale" value="{{ .Language.Lang }}" />
    <div class="form-group single-column">
      <label class="form__label " for="name"
        >{{ i18n "form_name_label" }}</label
      >
      <input
        class="form__input "
        type="text"
        id="name"
        name="name"
        autocomplete="name" />
    </div>

    <div class="form__group single-column">
      <label class="form__label" for="phone"
        >{{ i18n "form_phone_label" }}</label
      >
      <input
        class="form__input"
        type="tel"
        id="phone"
        name="phone"
        autocomplete="tel" />
    </div>

    <div class="form__group single-column">
      <label class="form__label" for="email"
        >{{ i18n "form_email_label" }}</label
      >
      <input
        class="form__input"
        type="email"
        id="email"
        name="email"
        autocomplete="email" />
    </div>

    <div class="form__group single-column">
      <label class="form__label" for="zipcode"
        >{{ i18n "form_zipcode_label" }}</label
      >
      <input
        class="form__input"
        type="text"
        id="zipcode"
        name="zipcode"
        autocomplete="postal-code" />
    </div>

    <fieldset class="full-width">
      <legend>{{ i18n "form_due_date_legend" }}</legend>
      <div class="date-grid">
        <div class="form-group single-column">
          <label class="form__label" for="month"
            >{{ i18n "form_month_label" }}</label
          >
          <input
            class="form__input"
            type="text"
            id="month"
            name="month"
            autocomplete="off" />
        </div>
        <div class="form-group single-column">
          <label class="form__label" for="day"
            >{{ i18n "form_day_label" }}</label
          >
          <input
            class="form__input"
            type="text"
            id="day"
            name="day"
            autocomplete="off" />
        </div>
        <div class="form-group single-column">
          <label class="form__label" for="year"
            >{{ i18n "form_year_label" }}</label
          >
          <input
            class="form__input"
            type="text"
            id="year"
            name="year"
            autocomplete="off" />
        </div>
      </div>
    </fieldset>

    <div class="dynamic-layout-container full-width">
      <fieldset>
        <legend>{{ i18n "form_looking_for_legend" }}</legend>
        <div class="input-grid">
          <input class="form__input" type="checkbox" id="birth-doula" /><label
            class="form__label"
            for="birth-doula"
            >{{ i18n "form_birth_doula_label" }}</label
          >
          <input
            class="form__input"
            type="checkbox"
            id="postpartum-doula" /><label
            class="form__label"
            for="postpartum-doula"
            >{{ i18n "form_postpartum_doula_label" }}</label
          >
          <input
            class="form__input"
            type="checkbox"
            id="lactation-support" /><label
            class="form__label"
            for="lactation-support"
            >{{ i18n "form_lactation_support_label" }}</label
          >
          <input
            class="form__input"
            type="checkbox"
            id="childbirth-classes" /><label
            class="form__label"
            for="childbirth-classes"
            >{{ i18n "form_childbirth_classes_label" }}</label
          >
          <input
            class="form__input"
            type="checkbox"
            id="other-info-looking-for" /><label
            class="form__label"
            for="other-info-looking-for"
            >{{ i18n "form_other_info_looking_for_label" }}</label
          >
        </div>
      </fieldset>

      <fieldset id="birth-location-fieldset" style="display: none;">
        <legend>{{ i18n "form_birth_location_legend" }}</legend>
        <div class="input-grid">
          <input
            class="form__input"
            type="radio"
            id="home-birth"
            name="birth-location"
            value="home" /><label class="form__label" for="home-birth"
            >{{ i18n "form_home_birth_label" }}</label
          >
          <input
            class="form__input"
            type="radio"
            id="highland"
            name="birth-location"
            value="Highland Hospital" /><label
            class="form__label"
            for="highland"
            >{{ i18n "form_highland_label" }}</label
          >
          <input
            class="form__input"
            type="radio"
            id="rochester-general"
            name="birth-location"
            value="Rochester General Hospital" /><label
            class="form__label"
            for="rochester-general"
            >{{ i18n "form_rochester_general_label" }}</label
          >
          <input
            class="form__input"
            type="radio"
            id="strong"
            name="birth-location"
            value="Strong Hospital" /><label class="form__label" for="strong"
            >{{ i18n "form_strong_label" }}</label
          >
          <input
            class="form__input"
            type="radio"
            id="other-hospital"
            name="birth-location"
            value="Other Hospital" /><label
            class="form__label"
            for="other-hospital"
            >{{ i18n "form_other_hospital_label" }}</label
          >
        </div>
        <div
          class="form-group single-column"
          id="other-hospital-input-container"
          style="display: none;">
          <label class="form__label" for="other-hospital-input"
            >{{ i18n "form_other_hospital_input_label" }}</label
          >
          <input
            class="form__input"
            type="text"
            id="other-hospital-input"
            name="other-hospital-input" />
        </div>
      </fieldset>

      <fieldset>
        <legend>
          {{ i18n "form_cost_offset_legend" }}
        </legend>
        <div class="input-grid">
          <input class="form__input" type="checkbox" id="medicaid" /><label
            class="form__label"
            for="medicaid"
            >{{ i18n "form_medicaid_label" }}</label
          >
          <input class="form__input" type="checkbox" id="carrot" /><label
            class="form__label"
            for="carrot"
            >{{ i18n "form_carrot_label" }}</label
          >
        </div>
      </fieldset>
    </div>
    <div class="form-group full-width">
      <label class="form__label " for="other-info"
        >{{ i18n "form_other_info_label" }}</label
      >
      <textarea
        class="form__input form__input--textarea "
        id="other-info"
        name="other-info"
        rows="5"></textarea>
    </div>

    <div
      id="form-error"
      class="form__error-message full-width"
      aria-live="polite"></div>
    <button type="submit" class="button">
      {{ i18n "form_submit_button" }}
    </button>
  </form>

  {{ partial "find-a-doula/what-happens-next.html" . }}
</div>
