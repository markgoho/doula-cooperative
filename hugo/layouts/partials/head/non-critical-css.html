<!-- Load Non-Critical Styles Asynchronously -->
{{ $nonCriticalCSS := resources.Get "css/non-critical.css" | resources.Minify | resources.Fingerprint }}
<link
  rel="preload"
  href="{{ $nonCriticalCSS.RelPermalink }}"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'" />

<link
  rel="preload"
  href="/assets/fonts/Geologica-VariableFont_CRSV,SHRP,slnt,wght.woff2"
  as="font"
  type="font/woff2"
  crossorigin />
<noscript>
  <link rel="stylesheet" href="{{ $nonCriticalCSS.RelPermalink }}" />
</noscript>
