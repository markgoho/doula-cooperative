# What happens next
[what_happens_next_callout]
other = "¿Qué pasa después de enviar el formulario?"

[what_happens_next_p1]
other = "Si estás buscando apoyo de doula, tu información será compartida con los miembros de la cooperativa."

[what_happens_next_p2]
other = "Las doulas que estén disponibles alrededor de tu fecha estimada de llegada te enviarán un correo electrónico para programar una consulta gratuita. Puedes recibir entre 2 y 20 correos dependiendo de quién esté disponible."

[what_happens_next_p3]
other = "Es común que las personas embarazadas se reúnan con algunas doulas para determinar con quién se sentirían más cómodas trabajando."

[what_happens_next_p4]
other = "Cuando estés lista para contratar a una de las doulas con las que te hayas reunido, puedes comunicarte con ellas directamente para firmar su contrato de cliente y pagar sus honorarios."

