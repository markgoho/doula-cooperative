# Home page
[home_tagline]
other = "Doulas para cada paso de tu camino de nacimiento"

[home_title]
other = "Bienvenida a la Cooperativa de Doulas de Rochester, NY"

[home_collective_highlight]
other = "Somos un colectivo"

[home_collective_text]
other = "de doulas con experiencia y compasión que apoyan a familias en Rochester y las comunidades cercanas. Nuestro modelo cooperativo ayuda a encontrar el apoyo adecuado para tus necesidades y transiciones de vida."

[home_believe_highlight]
other = "Creemos"

[home_believe_text]
other = "que el apoyo durante el nacimiento debe ser accesible, personalizado y arraigado en la comunidad. Cada doula aporta su propia experiencia y comparte nuestro compromiso con la atención basada en evidencia y el respeto por tus decisiones."

[home_support_highlight]
other = "Ofrecemos apoyo integral"

[home_support_text]
other = "desde educación prenatal hasta apoyo durante el parto, cuidado posparto y servicios especializados, para ayudarte a sentir confianza durante tu camino hacia la maternidad o paternidad."

[home_learn_title]
other = "Aprende más sobre las doulas"

[home_learn_description]
other = "Explora nuestros recursos para entender el rol y los beneficios de una doula."

[home_find_title]
other = "Encuentra la doula adecuada para ti"

[home_find_description]
other = "Conecta con la doula adecuada para ti usando nuestras herramientas de búsqueda."

[home_join_title]
other = "Únete a la Cooperativa de Doulas"

[home_join_description]
other = "Únete a nuestra comunidad de doulas y apóyense mutuamente en nuestra misión compartida."

