[home_believe_highlight]
other = "We believe"

[home_believe_text]
other = "birth support should be accessible, personalized, and rooted in community. Each doula brings their own expertise while sharing our commitment to evidence-based care and honoring your choices."

[home_support_highlight]
other = "We offer comprehensive support"

[home_support_text]
