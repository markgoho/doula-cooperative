# What happens next
[what_happens_next_callout]
other = "What happens after I submit the form?"

[what_happens_next_p1]
other = "If you're looking for doula support, your information will be shared with cooperative members."

[what_happens_next_p2]
other = "Doulas who are available around your estimated arrival date will email you to set up a complimentary consultation. You may receive 2 or 20 emails depending on who is available."

[what_happens_next_p3]
other = "It is common for pregnant people to meet with a few doulas to determine who they'd feel most comfortable working with."

[what_happens_next_p4]
other = "When you're ready to hire one of the doulas you've met with, you can contact them directly to sign their client agreement and pay their fee."

