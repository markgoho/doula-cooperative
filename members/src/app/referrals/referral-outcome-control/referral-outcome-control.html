<fieldset
  class="outcome"
  [attr.aria-busy]="saving() ? 'true' : null"
  aria-describedby="outcome-hint"
>
  <legend [class.prompt]="!selected()">{{ legend() }}</legend>

  <div class="options">
    @for (option of options; track option.value) {
      <button
        #optionButton
        type="button"
        class="option"
        [attr.aria-pressed]="selected() === option.value"
        (click)="choose(option.value)"
      >
        {{ option.label }}
      </button>
    }
    @if (selected()) {
      <button type="button" class="clear" (click)="clear()">Clear outcome</button>
    }
  </div>

  <p class="status" role="status">{{ status() }}</p>

  @if (saveError(); as error) {
    <p class="save-error" role="alert">{{ error }}</p>
  }

  <p id="outcome-hint" class="hint">
    Admins and the Referral Coordinator see your outcome. Other members only see "A member was
    hired", never who.
  </p>
</fieldset>
