<h2>Preview Your Profile</h2>
<p class="step-description">
  Here's how your profile will appear on our public doula directory. Click "Edit" next to any
  section to make changes.
</p>

<app-alert-banner variant="success">
  Your profile has been created! Review it below and click "Finish" when you're happy with it.
</app-alert-banner>

<div class="preview-wrapper">
  <app-profile-preview
    [profile]="profileData()"
    [imageUrl]="imageUrl()"
    [showEditLinks]="true"
    (editSection)="onEditSection($event)"
  />
</div>

<div class="form-actions">
  <button type="button" class="button button--primary" (click)="onFinish()">Finish</button>
</div>
