<h2>Preview Your Profile</h2>
<p class="step-description">
  Here's how your profile will appear on our public doula directory. Click "Edit" next to any
  section to make changes.
</p>

@if (errorMessage()) {
  <app-alert-banner variant="error">
    {{ errorMessage() }}
  </app-alert-banner>
}

<div class="preview-wrapper">
  <app-profile-preview
    [profile]="profileData()"
    [imageUrl]="imageUrl()"
    [showEditLinks]="true"
    (editSection)="onEditSection($event)"
  />
</div>

<div class="form-actions">
  <button
    type="button"
    class="button button--primary"
    (click)="onFinish()"
    [disabled]="loading()"
  >
    @if (loading()) {
      <span>Creating Profile...</span>
    } @else {
      <span>Finish</span>
    }
  </button>
</div>
