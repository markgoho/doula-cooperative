<div class="edit-profile">
  <h1>Edit Profile</h1>

  @if (isLoading()) {
    <p>Loading profile...</p>
  } @else if (error()) {
    <p class="error">Error: {{ error() }}</p>
  } @else {
    <div class="profile-content">
      <h2>Your Profile Content</h2>
      <pre>{{ profileContent() }}</pre>
    </div>
  }
</div>
