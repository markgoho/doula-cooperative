<h1>User Management</h1>
<div class="header-stats">
  <span>Total Members: {{ totalMembers() }}</span>
  <span>Unclaimed Profiles: {{ unclaimedTotal() }}</span>
</div>

<app-active-members-table [membersResource]="membersResource" />

<app-unclaimed-profiles-table
  [profiles]="unclaimedProfiles()"
  [loading]="unclaimedLoading()"
  [error]="unclaimedError()"
/>
