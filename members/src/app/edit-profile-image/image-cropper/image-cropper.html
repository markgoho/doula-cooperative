<div class="cropper-container">
  <h2 id="cropper-heading">Crop Your Photo</h2>
  <p class="cropper-instructions">
    Drag to reposition and resize the square crop box to select the area you want.
  </p>

  <!-- Cropper Area -->
  <div class="cropper-wrapper">
    @if (imageUrl()) {
      <img
        #cropperImage
        [src]="imageUrl()"
        alt="Image to crop"
        class="cropper-image"
      />
    } @else if (imageLoadError()) {
      <div class="error">
        <p>{{ imageLoadError() }}</p>
      </div>
    } @else {
      <div class="loading">
        <p>Loading image...</p>
      </div>
    }
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button
      type="button"
      class="button button--secondary"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="button button--primary"
      (click)="confirm()"
      [disabled]="!imageUrl()"
    >
      Save Photo
    </button>
  </div>
</div>
