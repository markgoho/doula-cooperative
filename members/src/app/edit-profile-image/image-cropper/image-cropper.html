@if (imageUrl()) {
  <cropper-canvas background [style.width.px]="canvasWidth()">
    <cropper-image
      [attr.src]="imageUrl()"
      initial-center-size="contain"
      translatable
    ></cropper-image>
    <cropper-shade></cropper-shade>
    <cropper-selection
      #cropperSelection
      aspect-ratio="1"
      initial-coverage="0.8"
      movable
      resizable
      outlined
    >
      <cropper-grid role="grid" covered></cropper-grid>
      <cropper-crosshair centered></cropper-crosshair>
      <cropper-handle action="move" plain></cropper-handle>
      <cropper-handle action="n-resize"></cropper-handle>
      <cropper-handle action="e-resize"></cropper-handle>
      <cropper-handle action="s-resize"></cropper-handle>
      <cropper-handle action="w-resize"></cropper-handle>
      <cropper-handle action="ne-resize"></cropper-handle>
      <cropper-handle action="nw-resize"></cropper-handle>
      <cropper-handle action="se-resize"></cropper-handle>
      <cropper-handle action="sw-resize"></cropper-handle>
    </cropper-selection>
  </cropper-canvas>
} @else if (imageLoadError()) {
  <p>{{ imageLoadError() }}</p>
} @else {
  <p>Loading image...</p>
}

<div class="actions">
  <button type="button" class="button button--secondary" (click)="cancel()">Cancel</button>
  <button type="button" class="button button--primary" (click)="confirm()" [disabled]="!imageUrl()">
    Save Photo
  </button>
</div>
