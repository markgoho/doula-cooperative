<div class="cropper-container">
  <h2 id="cropper-heading">Crop Your Photo</h2>

  <p class="cropper-instructions">Pinch or use the slider to zoom. Drag to reposition.</p>

  <div class="cropper-layout">
    <div class="cropper-main">
      <div class="cropper-toolbar">
        <button
          type="button"
          class="button button--secondary small icon-button"
          (click)="rotateLeft()"
          title="Rotate Left"
          aria-label="Rotate Left"
        >
          ↺
        </button>
        <button
          type="button"
          class="button button--secondary small icon-button"
          (click)="resetTransform()"
          title="Reset"
          aria-label="Reset"
        >
          Reset
        </button>
        <button
          type="button"
          class="button button--secondary small icon-button"
          (click)="rotateRight()"
          title="Rotate Right"
          aria-label="Rotate Right"
        >
          ↻
        </button>
      </div>

      <div class="cropper-wrapper">
        @if (imageUrl()) {
          <img #cropperImage [src]="imageUrl()" alt="Image to crop" class="cropper-image" />
        } @else if (imageLoadError()) {
          <div class="error">
            <p>{{ imageLoadError() }}</p>
          </div>
        } @else {
          <div class="loading">
            <p>Loading image...</p>
          </div>
        }
      </div>

      <div class="zoom-controls">
        <button
          type="button"
          class="button button--secondary small icon-button"
          (click)="zoomOut()"
          title="Zoom Out"
          aria-label="Zoom Out"
        >
          −
        </button>
        <input
          type="range"
          min="0.1"
          max="3"
          step="0.01"
          [value]="zoomLevel()"
          (input)="onZoomSlider($event)"
          class="zoom-slider"
          aria-label="Zoom Level"
        />
        <button
          type="button"
          class="button button--secondary small icon-button"
          (click)="zoomIn()"
          title="Zoom In"
          aria-label="Zoom In"
        >
          +
        </button>
      </div>
    </div>

    <div class="cropper-sidebar">
      <div class="preview-container">
        <label class="preview-label">Preview</label>
        <div class="preview-circle">
          @if (previewUrl()) {
            <img [src]="previewUrl()" alt="Crop preview" />
          } @else {
            <div class="preview-placeholder"></div>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button type="button" class="button button--secondary" (click)="cancel()">Cancel</button>
    <button
      type="button"
      class="button button--primary"
      (click)="confirm()"
      [disabled]="!imageUrl()"
    >
      Save Photo
    </button>
  </div>
</div>
